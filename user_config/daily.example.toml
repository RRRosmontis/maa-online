# MAA Online 一键日常配置
# 修改参数前请阅读同目录 README.md。

client_type = "Official"
startup = true
closedown = true

# 1. 基建一键轮换
[[tasks]]
name = "基建一键轮换"
type = "Infrast"

[tasks.params]
mode = 20000
facility = ["Mfg", "Trade", "Power", "Control", "Reception", "Office", "Dorm"]
drones = "_NotUse"
threshold = 0.3
dorm_notstationed_enabled = false
dorm_trust_enabled = false

# 2. 自动公招
[[tasks]]
name = "自动公招"
type = "Recruit"

[tasks.params]
refresh = true
select = [5, 4]
confirm = [4, 3]
first_tags = ["高级资深干员"]
extra_tags_mode = 0
times = 4
set_time = true
expedite = false
preserve_tags = ["高级资深干员", "资深干员", "支援机械"]
recruitment_time = { "3" = 540, "4" = 540 }
report_to_penguin = false
report_to_yituliu = false
server = "CN"

# 3. 清理理智：默认刷 1-7，不吃药、不碎石
[[tasks]]
name = "清理理智"
type = "Fight"

[tasks.params]
stage = "1-7"
medicine = 0
medicine_expire_days = 0
stone = 0
times = 999
series = 0
report_to_penguin = false
report_to_yituliu = false
client_type = "Official"

# 4. 好友信用与信用商店
[[tasks]]
name = "信用商店"
type = "Mall"

[tasks.params]
visit_friends = true
shopping = true
buy_first = ["招聘许可", "龙门币"]
blacklist = ["家具零件", "加急许可"]
force_shopping_if_credit_full = false
only_buy_discount = false
reserve_max_credit = true
credit_fight = false
formation_index = 0

# 5. 领取日常和周常任务奖励
[[tasks]]
name = "领取奖励"
type = "Award"

[tasks.params]
award = true
mail = true
recruit = false
orundum = false
